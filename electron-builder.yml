# electron-builder 26 configuration for Tunnelview (Windows + macOS).
# Every option below is checked against node_modules/app-builder-lib/scheme.json.
# Icons in build/ are generated by `npm run icons` (scripts/make-icons.js); the dist scripts run it first.

appId: io.github.naminaone99.tunnelview
productName: Tunnelview
copyright: Copyright © 2026 Phanuphong Saphanon

directories:
  output: dist
  buildResources: build

# Application sources. Production node_modules (ws, koffi + its @koromix platform package) are
# collected by electron-builder automatically; the "!" patterns are applied to them as well.
files:
  - package.json
  - src/**/*
  - "!test{,/**/*}"
  - "!docs{,/**/*}"
  - "!scripts{,/**/*}"
  - "!.github{,/**/*}"
  - "!**/*.{md,map}"
  - "!**/*.d.ts"

asar: true
# koffi 3 loads its native binary from @koromix/koffi-<platform>-<arch>/<triplet>/koffi.node via a
# path computed at runtime; native .node files cannot be dlopen()ed from inside app.asar, so both
# packages are unpacked to app.asar.unpacked (Electron's asar shim redirects require() there).
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**

# There are no node-gyp modules: koffi ships prebuilt Node-API binaries (ABI-stable across Node and
# Electron, selected per platform/arch at runtime) and ws runs without its optional native addons.
# Skipping the rebuild also avoids koffi's "install" script trying a from-source CMake build when
# packaging the non-host arch.
npmRebuild: false

# Electron fuses, flipped in the packaged Electron binary right before signing (keys:
# FuseOptionsV1 in scheme.json). Stock Electron lets anyone who can start Tunnelview.exe /
# Tunnelview.app run arbitrary JS in it: ELECTRON_RUN_AS_NODE=1, NODE_OPTIONS=--require …, --inspect
# or an edited app.asar. On macOS that code would inherit Tunnelview's Screen Recording and
# Accessibility grants (a TCC bypass for any local process). Development runs (`npm start`) use
# node_modules/electron unchanged and are not affected.
#   runAsNode false                      ignore ELECTRON_RUN_AS_NODE (Tunnelview never forks a Node child)
#   enableCookieEncryption true          encrypt the (unused) cookie store with the OS key. One-way:
#                                        never set it back to false, existing cookies become unreadable
#   enableNodeOptionsEnvironmentVariable false   ignore NODE_OPTIONS / NODE_EXTRA_CA_CERTS
#   enableNodeCliInspectArguments false  ignore --inspect* / --inspect-brk and SIGUSR1
#   enableEmbeddedAsarIntegrityValidation true   app.asar must match the header hash electron-builder
#                                        embeds (Windows: INTEGRITY/ELECTRONASAR exe resource;
#                                        macOS: Info.plist ElectronAsarIntegrity). The koffi files in
#                                        app.asar.unpacked are outside the archive and unaffected.
#   onlyLoadAppFromAsar true             never fall back to resources/app/ or default_app.asar
# grantFileProtocolExtraPrivileges stays at Electron's default: every renderer page is loaded from
# file:// and imports its ES modules over file://.
# scripts/verify-fuses.js checks the packaged result (CI runs it after every build).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# No auto-update feed; artifacts are uploaded by the CI workflow instead. Prevents electron-builder
# from auto-publishing to GitHub when it detects CI + a tag.
publish: null

# ---------------------------------------------------------------------------------------------
# Windows — NSIS installers, one per architecture
# ---------------------------------------------------------------------------------------------
win:
  # Multi-size .ico rasterized natively at each size by scripts/make-icons.js (crisp 16–48 px).
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  # Per-machine install: the installer runs elevated, which `netsh advfirewall` needs to add the
  # Tailscale-scoped firewall rules in build/installer.nsh.
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tunnelview
  runAfterFinish: true
  # Separate x64 / arm64 installers (smaller downloads) instead of one combined installer.
  buildUniversalInstaller: false
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

# ---------------------------------------------------------------------------------------------
# macOS — dmg + zip for Apple Silicon and Intel
# ---------------------------------------------------------------------------------------------
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Electron 45 supports macOS 13 Ventura and newer (node_modules/electron/README.md).
  minimumSystemVersion: "13.0"
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signature ("-"): builds are not notarized, but Apple Silicon refuses to run unsigned
  # code and a consistent ad-hoc seal lets the hardened-runtime entitlements apply. Requires the
  # disable-library-validation entitlement (present). To ship with a Developer ID instead:
  #   npx electron-builder --mac -c.mac.identity="Developer ID Application: NAME (TEAMID)" -c.mac.notarize=true
  # (plus APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER in the environment for notarization).
  identity: "-"
  notarize: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  extendInfo:
    # Real Info.plist privacy keys only (plain one-line strings). Screen Recording and Accessibility
    # have no usage-string keys; macOS shows its own text for those (see README "macOS permissions").
    # Required by macOS 14.2+ before any system-audio capture (Electron desktopCapturer docs).
    NSAudioCaptureUsageDescription: Tunnelview streams this Mac's sound to the person you let connect, if you allow audio for the session.
    # Shown if macOS 15+ asks for Local Network access for the tailnet connections.
    NSLocalNetworkUsageDescription: Tunnelview connects directly to your own devices over your Tailscale network for remote desktop sessions.
    # ~/Downloads is TCC-protected and the default receive folder is ~/Downloads/Tunnelview. Without
    # this key the consent alert gives no reason. Main triggers it (files.prepareDir) at startup,
    # when hosting is switched on and when the download folder changes, i.e. while someone is at
    # the Mac: nobody can answer it remotely during a session.
    NSDownloadsFolderUsageDescription: Tunnelview saves files that people you connect with send you in Downloads/Tunnelview.

dmg:
  writeUpdateInfo: false

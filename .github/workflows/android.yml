# Tunnelview Android viewer (mobile/): test, build an UNSIGNED APK, then sign it in a separate
# job that holds the key but runs no third-party build code (no pub, Gradle or npm).
#   - test:         format, analyze, unit tests, repo gates.
#   - build:        universal release APK (R8, not debuggable, unsigned) + gates
#                   (scripts/check-apk.js). No secrets, no environment, no caches. The Flutter
#                   SDK is a hash-pinned archive.
#   - sign-dev:     branch pushes in this repository: dev key (repository secrets),
#                   io.github.naminaone99.tunnelview.dev, "Tunnelview Dev".
#   - sign-release: tags v* only (via workflow_call from build.yml later), environment
#                   "release" (owner approval): release key.
#   - ios-compile:  `flutter build ios --release --no-codesign`, a compile check only.
#
# The sign jobs sign only the APK the build job produced: they download the artifact by the ID
# the build job reported and check the APK against the SHA-256 in the build job's outputs.
# Other jobs in the run cannot change either value (an artifact can be replaced, a job output
# cannot).
#
# Every action is pinned to a full commit SHA (the comment names its release tag).
name: android

on:
  push:
    branches:
      - main
      - mobile-0.3
    paths:
      - "mobile/**"
      - "scripts/check-apk.js"
      - "test/check-apk.test.js"
      - "package.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "scripts/check-apk.js"
      - "test/check-apk.test.js"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: "3.47.9"
  # Preinstalled on ubuntu-latest; pinned by path so signing never downloads tools.
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  test:
    name: Test (format, analyze, unit tests, gates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No signing material is tracked
        run: |
          if git ls-files | grep -Ei '\.(jks|p12|pfx|keystore|pem|key)$|(^|/)key\.properties$'; then
            echo "::error::signing material is tracked in git (listed above)"; exit 1
          fi
          echo "ok: no keystores, keys or key.properties tracked"

      - name: Only lib/rtc/engine.dart imports flutter_webrtc
        run: |
          bad="$(git ls-files 'mobile/*.dart' | xargs -r grep -l 'package:flutter_webrtc' | grep -vx 'mobile/lib/rtc/engine.dart' || true)"
          if [ -n "$bad" ]; then
            echo "::error::only mobile/lib/rtc/engine.dart may import package:flutter_webrtc:"; echo "$bad"; exit 1
          fi
          if grep -nE "^\s*export\s+['\"]package:flutter_webrtc" mobile/lib/rtc/engine.dart; then
            echo "::error::engine.dart must not re-export flutter_webrtc"; exit 1
          fi
          echo "ok"

      - name: pubspec.lock allow-list
        run: node scripts/check-apk.js lock mobile/pubspec.lock mobile/pubspec-allow.txt

      - name: APK gate unit tests (scripts/check-apk.js)
        run: node --test test/check-apk.test.js

      # CRITIQUE N8: fakes and test policies live under mobile/test only. And the app must never
      # use Android's VPN-provider API: that would replace Tailscale as the phone's VPN.
      - name: No test-only code in lib/, no VPN-provider API
        run: |
          if grep -rnE 'package:flutter_test|package:test/|test/support|forTesting' mobile/lib; then
            echo "::error::test-only code or imports under mobile/lib (listed above)"; exit 1
          fi
          if grep -rn 'VpnService' mobile/lib mobile/android/app/src; then
            echo "::error::Tunnelview must never use VpnService (listed above)"; exit 1
          fi
          echo "ok"

      # PLAN §6.10: no logging of IPs, tokens, nonces or proofs. Release builds silence Flutter's
      # error printing (lib/app/quiet_errors.dart); app code never prints or logs at all.
      - name: No printing or logging in app code
        run: |
          if grep -rnE '\b(print|debugPrint|debugPrintStack)\(' mobile/lib; then
            echo "::error::print/debugPrint in mobile/lib (listed above): logcat ends up in bug reports"; exit 1
          fi
          if grep -rnE 'android\.util\.Log|\bLog\.[a-z]+\(|\bprintln\(|printStackTrace\(' mobile/android/app/src; then
            echo "::error::logging in the app's Kotlin code (listed above)"; exit 1
          fi
          echo "ok"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: pub get (lockfile enforced)
        id: pubget
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      # On failure the formatted diff is printed and uploaded (dart-format-patch); analyze and the
      # tests still run, so one run reports everything.
      - name: dart format
        working-directory: mobile
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            dart format lib test >/dev/null
            git diff > "$RUNNER_TEMP/dart-format.patch"
            git diff
            echo "::error::run dart format (diff above; also in the dart-format-patch artifact)"; exit 1
          fi

      - name: Upload the dart format patch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dart-format-patch
          path: ${{ runner.temp }}/dart-format.patch
          if-no-files-found: ignore
          retention-days: 3

      - name: flutter analyze
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        working-directory: mobile
        run: flutter analyze

      - name: flutter test
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        working-directory: mobile
        run: flutter test

  build:
    name: Build unsigned APK + gates
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
      code: ${{ steps.ver.outputs.code }}
      # What the sign jobs sign: the artifact by ID, and the APK by hash.
      apk_sha256: ${{ steps.stage.outputs.apk_sha256 }}
      unsigned_artifact_id: ${{ steps.upload_unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # The Flutter SDK that compiles the APK is pinned by content, not by version name: the
      # archive's SHA-256 (from releases_linux.json, committed here), then the framework commit
      # and the engine hash inside it. The engine's Maven artifacts are also pinned by
      # mobile/android/gradle/verification-metadata.xml. Update all four with FLUTTER_VERSION.
      - name: Flutter SDK (hash-pinned archive)
        env:
          FLUTTER_ARCHIVE: stable/linux/flutter_linux_3.47.9-stable.tar.xz
          FLUTTER_SHA256: 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a
          FLUTTER_FRAMEWORK: c197ca5199e9ee5661e865596c9c07294dfab51c
          FLUTTER_ENGINE: 89c39edfdfae2949f6806e4a315c0c08522238b7
        run: |
          set -euo pipefail
          case "$FLUTTER_ARCHIVE" in *"_${FLUTTER_VERSION}-stable.tar.xz") ;; *)
            echo "::error::FLUTTER_ARCHIVE does not match FLUTTER_VERSION $FLUTTER_VERSION"; exit 1 ;; esac
          a="$RUNNER_TEMP/flutter.tar.xz"
          curl -fsSL --retry 5 --connect-timeout 15 -o "$a" \
            "https://storage.googleapis.com/flutter_infra_release/releases/$FLUTTER_ARCHIVE"
          echo "$FLUTTER_SHA256  $a" | sha256sum -c -
          tar xf "$a" -C "$RUNNER_TEMP"
          rm -f "$a"
          root="$RUNNER_TEMP/flutter"
          head="$(git -C "$root" rev-parse HEAD)"
          [ "$head" = "$FLUTTER_FRAMEWORK" ] || { echo "::error::Flutter framework commit $head, expected $FLUTTER_FRAMEWORK"; exit 1; }
          engine="$(tr -d '[:space:]' < "$root/bin/internal/engine.version")"
          [ "$engine" = "$FLUTTER_ENGINE" ] || { echo "::error::Flutter engine $engine, expected $FLUTTER_ENGINE"; exit 1; }
          {
            echo "FLUTTER_ROOT=$root"
            echo "PUB_CACHE=$HOME/.pub-cache"
          } >> "$GITHUB_ENV"
          {
            echo "$root/bin"
            echo "$root/bin/cache/dart-sdk/bin"
            echo "$HOME/.pub-cache/bin"
          } >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      # versionName = package.json version. versionCode:
      #   release (tags v*): MAJOR*10000 + MINOR*100 + PATCH, e.g. 0.3.0 -> 300.
      #   dev (branches, PRs): (MAJOR*10000 + MINOR*100 + PATCH) * 100000 + run number,
      #     e.g. 0.3.0, run 57 -> 30000057. It always increases: a version bump adds at least
      #     100000, which outweighs any run number below 100000, and later runs of the same
      #     version have larger run numbers. Dev builds use their own application ID (.dev),
      #     so dev codes never compete with release codes. Valid up to version 2.10.0 and run
      #     99999 (Android's limit is 2100000000); the step fails beyond that.
      # Node: the runner's preinstalled one (check-apk.js needs only Node 18+ built-ins).
      - name: Version, build number and channel
        id: ver
        run: |
          VER="$(node -p "require('./package.json').version")"
          if ! [[ "$VER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::package.json version '$VER' is not MAJOR.MINOR.PATCH"; exit 1
          fi
          MA=$((10#${BASH_REMATCH[1]})); MI=$((10#${BASH_REMATCH[2]})); PA=$((10#${BASH_REMATCH[3]}))
          if (( MI > 99 || PA > 99 )); then echo "::error::MINOR and PATCH must be <= 99"; exit 1; fi
          BASE=$(( MA*10000 + MI*100 + PA ))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CH=release
            CODE=$BASE
            if [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VER"; exit 1
            fi
          else
            CH=dev
            if (( GITHUB_RUN_NUMBER >= 100000 )); then echo "::error::run number too large for the dev versionCode scheme"; exit 1; fi
            CODE=$(( BASE*100000 + GITHUB_RUN_NUMBER ))
          fi
          if (( CODE < 1 || CODE > 2100000000 )); then echo "::error::versionCode $CODE out of range"; exit 1; fi
          PKG=io.github.naminaone99.tunnelview
          if [ "$CH" = dev ]; then PKG="$PKG.dev"; fi
          {
            echo "version=$VER"; echo "channel=$CH"; echo "code=$CODE"; echo "package=$PKG"
          } >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_tunnelviewChannel=$CH" >> "$GITHUB_ENV"
          echo "version $VER, versionCode $CODE, channel $CH, package $PKG"

      # Strict verification, set where the repository cannot weaken it: Gradle reads
      # GRADLE_USER_HOME/gradle.properties before the project's file. The checks also catch an
      # accidental weakening in the repository (a second, later mode line wins in a properties
      # file; trust entries skip verification).
      - name: Gradle dependency verification is strict and complete
        run: |
          set -euo pipefail
          f=mobile/android/gradle/verification-metadata.xml
          p=mobile/android/gradle.properties
          [ -s "$f" ] || { echo "::error::$f is missing (run the mobile-bootstrap workflow)"; exit 1; }
          n="$(grep -cE '^\s*org\.gradle\.dependency\.verification\s*[=:]' "$p" || true)"
          if [ "$n" != 1 ] || ! grep -qx 'org.gradle.dependency.verification=strict' "$p"; then
            echo "::error::$p must set org.gradle.dependency.verification=strict, exactly once"; exit 1
          fi
          if grep -nE '<trusted-artifacts|<trust[ >]' "$f"; then
            echo "::error::$f exempts artifacts from verification (listed above)"; exit 1
          fi
          grep -q '<verify-metadata>true</verify-metadata>' "$f" || {
            echo "::error::$f must verify metadata files too"; exit 1; }
          if grep -rEn 'dependencyVerification|DependencyVerificationMode|dependency-verification' mobile/android \
            --include='*.kts' --include='*.gradle' --include='*.properties'; then
            echo "::error::the build changes dependency verification (listed above)"; exit 1
          fi
          mkdir -p "$HOME/.gradle"
          echo 'org.gradle.dependency.verification=strict' >> "$HOME/.gradle/gradle.properties"
          echo "ok: strict, forced in $HOME/.gradle/gradle.properties"

      - name: Build the universal release APK (unsigned)
        working-directory: mobile
        env:
          VER: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          CH: ${{ steps.ver.outputs.channel }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --build-name "$VER" --build-number "$CODE" \
            --dart-define=TUNNELVIEW_CHANNEL="$CH" --dart-define=TUNNELVIEW_VERSION="$VER" \
            --dart-define=TUNNELVIEW_BUILD="$CODE"

      - name: Resolved releaseRuntimeClasspath vs allow-list
        run: |
          (cd mobile/android && ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath) \
            > "$RUNNER_TEMP/runtime-classpath.txt"
          node scripts/check-apk.js classpath "$RUNNER_TEMP/runtime-classpath.txt" \
            mobile/android/runtime-classpath-allow.txt

      - name: pubspec.lock allow-list
        run: node scripts/check-apk.js lock mobile/pubspec.lock mobile/pubspec-allow.txt

      - name: APK gates (manifest, entries, dex, R8 mapping, alignment, unsigned)
        run: |
          node scripts/check-apk.js apk mobile/build/app/outputs/flutter-apk/app-release.apk \
            --package "${{ steps.ver.outputs.package }}" \
            --build-tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" \
            --mapping mobile/build/app/outputs/mapping/release/mapping.txt \
            --unsigned

      # Internal files carry an "internal-" prefix; build.yml's release job refuses to publish
      # them.
      - name: Stage the unsigned APK
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/internal-app-release-unsigned.apk
          cp mobile/build/app/outputs/mapping/release/mapping.txt dist/internal-mapping.txt
          cp "$RUNNER_TEMP/runtime-classpath.txt" dist/internal-runtime-classpath.txt
          sum="$(sha256sum dist/internal-app-release-unsigned.apk | cut -d' ' -f1)"
          echo "apk_sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "unsigned APK SHA-256: $sum"

      - name: Upload the unsigned APK (internal, never released)
        id: upload_unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-android-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sign-dev:
    name: Sign (dev key)
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.repository == 'NamiNaone99/Tunnelview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      VER: ${{ needs.build.outputs.version }}
      APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/check-apk.js
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.unsigned_artifact_id }}
          path: in
          merge-multiple: true

      - name: The build job produced this dev build
        run: |
          set -euo pipefail
          [ "${{ needs.build.outputs.channel }}" = dev ] || { echo "::error::not a dev build"; exit 1; }
          if ! [[ "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the build job reported no APK SHA-256"; exit 1
          fi
          echo "$APK_SHA256  in/internal-app-release-unsigned.apk" | sha256sum -c -

      - name: Sign with the dev key (apksigner only)
        env:
          KS_B64: ${{ secrets.ANDROID_DEV_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then echo "::error::dev signing secrets are missing"; exit 1; fi
          umask 077
          KS="$RUNNER_TEMP/dev.p12"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          mkdir -p out
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign \
            --ks "$KS" --ks-type PKCS12 --ks-key-alias tunnelview-dev \
            --ks-pass env:KS_PW --key-pass env:KS_PW \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "out/Tunnelview-$VER-android-dev.apk" in/internal-app-release-unsigned.apk

      - name: Verify signer, manifest and alignment
        run: |
          node scripts/check-apk.js apk "out/Tunnelview-$VER-android-dev.apk" \
            --package io.github.naminaone99.tunnelview.dev \
            --build-tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" \
            --cert "${{ vars.ANDROID_DEV_CERT_SHA256 }}"
          (cd out && sha256sum -- *.apk | tee SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tunnelview-${{ needs.build.outputs.version }}-android-dev
          path: |
            out/*.apk
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dev.p12"

  sign-release:
    name: Sign (release key)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'NamiNaone99/Tunnelview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    defaults:
      run:
        shell: bash
    env:
      VER: ${{ needs.build.outputs.version }}
      APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/check-apk.js
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.unsigned_artifact_id }}
          path: in
          merge-multiple: true

      - name: The build job produced this release build
        run: |
          set -euo pipefail
          [ "${{ needs.build.outputs.channel }}" = release ] || { echo "::error::not a release build"; exit 1; }
          if ! [[ "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the build job reported no APK SHA-256"; exit 1
          fi
          echo "$APK_SHA256  in/internal-app-release-unsigned.apk" | sha256sum -c -

      - name: Sign with the release key (apksigner only)
        env:
          KS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then echo "::error::release signing secrets are missing"; exit 1; fi
          umask 077
          KS="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          mkdir -p out
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign \
            --ks "$KS" --ks-type PKCS12 --ks-key-alias tunnelview \
            --ks-pass env:KS_PW --key-pass env:KS_PW \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "out/Tunnelview-$VER-android.apk" in/internal-app-release-unsigned.apk

      - name: Verify signer, manifest and alignment
        run: |
          node scripts/check-apk.js apk "out/Tunnelview-$VER-android.apk" \
            --package io.github.naminaone99.tunnelview \
            --build-tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" \
            --cert "${{ vars.ANDROID_RELEASE_CERT_SHA256 }}"
          (cd out && sha256sum -- *.apk | tee SHA256SUMS-android.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tunnelview-android
          path: |
            out/*.apk
            out/SHA256SUMS-android.txt
          if-no-files-found: error

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  ios-compile:
    name: iOS compile check (no signing)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter build ios --release --no-codesign
        working-directory: mobile
        run: |
          VER="$(node -p "require('../package.json').version")"
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign --build-name "$VER" --build-number 1 \
            --dart-define=TUNNELVIEW_CHANNEL=dev --dart-define=TUNNELVIEW_VERSION="$VER"

# Builds Tunnelview for Windows (x64 + arm64 NSIS installers) and macOS (arm64 + x64 dmg/zip).
# Tag pushes (v*) also sign the in-app update manifest (job update-manifest, environment `release`)
# and then publish a GitHub release with every artifact and tunnelview-update.json attached.
# Release tags must be exactly vX.Y.Z (= package.json "version"): the manifest and the updater know
# no pre-release versions, so a tag like v0.4.0-beta.1 fails. Use workflow_dispatch for test builds.
name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Builds are unsigned / ad-hoc signed (see electron-builder.yml): never search for certificates.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows (x64 + arm64)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$GITHUB_REF_NAME" =~ $re ]] || { echo "::error::release tags must be vX.Y.Z (no pre-release suffix): $GITHUB_REF_NAME"; exit 1; }
          want="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $want"; exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # npm only installs koffi's native package for the runner's own arch (win32-x64). The arm64
      # installer needs @koromix/koffi-win32-arm64 as well, pinned to the exact koffi version.
      - name: Add koffi binary for Windows arm64
        run: |
          KOFFI_VERSION="$(node -p "require('./node_modules/koffi/package.json').version")"
          npm install --no-save --force "@koromix/koffi-win32-arm64@${KOFFI_VERSION}"

      # Equivalent to `npm test`; the glob form is used because Node 22 treats a bare directory
      # argument (`node --test test/`) as a module path and fails.
      - name: Unit tests
        run: node --test "test/**/*.test.js"

      - name: Syntax check
        run: node scripts/check.js

      - name: Build installers
        run: npm run dist:win -- --publish never

      - name: Verify koffi is bundled for each arch
        run: |
          check() {
            if ! ls "$1"/app.asar.unpacked/node_modules/@koromix/"$2"/*/koffi.node >/dev/null 2>&1; then
              echo "::error::$2 native binary missing from $1"; exit 1
            fi
            echo "ok: $2 in $1"
          }
          check dist/win-unpacked/resources koffi-win32-x64
          check dist/win-arm64-unpacked/resources koffi-win32-arm64

      # electronFuses from electron-builder.yml really flipped (no ELECTRON_RUN_AS_NODE, NODE_OPTIONS
      # or --inspect) and the embedded ASAR integrity hash matches app.asar. Reads files only.
      - name: Verify Electron fuses and ASAR integrity
        run: node scripts/verify-fuses.js dist/win-unpacked/Tunnelview.exe dist/win-arm64-unpacked/Tunnelview.exe

      - uses: actions/upload-artifact@v7
        with:
          name: Tunnelview-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS (arm64 + x64)
    # macos-latest is an Apple Silicon (arm64) runner.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$GITHUB_REF_NAME" =~ $re ]] || { echo "::error::release tags must be vX.Y.Z (no pre-release suffix): $GITHUB_REF_NAME"; exit 1; }
          want="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $want"; exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # The runner is arm64, so npm skips @koromix/koffi-darwin-x64 (cpu mismatch). --force installs
      # it anyway so the Intel build also carries its koffi binary.
      - name: Add koffi binary for macOS x64
        run: |
          KOFFI_VERSION="$(node -p "require('./node_modules/koffi/package.json').version")"
          npm install --no-save --force "@koromix/koffi-darwin-x64@${KOFFI_VERSION}"

      - name: Unit tests
        run: node --test "test/**/*.test.js"

      - name: Syntax check
        run: node scripts/check.js

      - name: Build dmg + zip
        run: npm run dist:mac -- --arm64 --x64 --publish never

      - name: Verify koffi is bundled for each arch
        run: |
          check() {
            if ! ls "$1"/app.asar.unpacked/node_modules/@koromix/"$2"/*/koffi.node >/dev/null 2>&1; then
              echo "::error::$2 native binary missing from $1"; exit 1
            fi
            echo "ok: $2 in $1"
          }
          check dist/mac-arm64/Tunnelview.app/Contents/Resources koffi-darwin-arm64
          check dist/mac/Tunnelview.app/Contents/Resources koffi-darwin-x64
          # Ad-hoc signature must verify, or Apple Silicon refuses to launch the app.
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Tunnelview.app
          codesign --verify --deep --strict --verbose=2 dist/mac/Tunnelview.app

      # Each release zip, checked the way the in-app updater installs it (updater.js _installMac):
      # a zip that would fail those checks on users' Macs never gets into a signed manifest.
      # `ls -A`: the updater's readdir counts dot-entries too.
      - name: Verify the update zips the way the updater installs them
        run: |
          want="$(node -p "require('./package.json').version")"
          for pair in arm64:arm64 x64:x86_64; do
            a="${pair%%:*}"; cpu="${pair##*:}"
            zip="dist/Tunnelview-${want}-mac-${a}.zip"
            [ -f "$zip" ] || { echo "::error::$zip is missing"; exit 1; }
            tmp="$(mktemp -d)"
            ditto -x -k --noqtn "$zip" "$tmp"
            [ "$(ls -A "$tmp")" = "Tunnelview.app" ] || { echo "::error::$zip must hold exactly Tunnelview.app"; exit 1; }
            app="$tmp/Tunnelview.app"; plist="$app/Contents/Info.plist"
            [ "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = "io.github.naminaone99.tunnelview" ] || { echo "::error::$zip: wrong bundle id"; exit 1; }
            [ "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$want" ] || { echo "::error::$zip: wrong version"; exit 1; }
            [ "$(plutil -extract CFBundleExecutable raw -o - "$plist")" = "Tunnelview" ] || { echo "::error::$zip: wrong executable"; exit 1; }
            lipo -archs "$app/Contents/MacOS/Tunnelview" | tr ' ' '\n' | grep -qx "$cpu" || { echo "::error::$zip: not $cpu"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$app"
            rm -rf "$tmp"
            echo "ok: $zip"
          done

      # Fuses are flipped before signing, so this also confirms the signed binaries carry them.
      - name: Verify Electron fuses and ASAR integrity
        run: node scripts/verify-fuses.js dist/mac-arm64/Tunnelview.app dist/mac/Tunnelview.app

      - uses: actions/upload-artifact@v7
        with:
          name: Tunnelview-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  # Signs tunnelview-update.json, the manifest the in-app updater trusts (docs/ARCHITECTURE.md §7
  # updater.js). The only job that sees UPDATE_SIGNING_KEY: the `release` environment holds it,
  # deploys only from v* tags and waits for the owner's approval. It runs no npm install and no
  # project dependency (scripts/sign-update.js uses Node built-ins only), never persists the
  # checkout token, and every action is pinned to a full commit SHA (the tag is the comment).
  update-manifest:
    name: Signed update manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Release tag matches package.json version
        shell: bash
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$GITHUB_REF_NAME" =~ $re ]] || { echo "::error::release tags must be vX.Y.Z (no pre-release suffix): $GITHUB_REF_NAME"; exit 1; }
          want="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $want"; exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: Tunnelview-*
          path: assets
          merge-multiple: true

      # Release notes are optional: .github/release-notes/v<version>.txt (plain text, at most 4000
      # characters) when it exists in the tagged commit. The secret is given to this step only.
      - name: Sign tunnelview-update.json
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=".github/release-notes/v${version}.txt"
          set -- --version "$version" --dir assets --pub "$UPDATE_PUBLIC_KEY"
          if [ -f "$notes" ]; then
            set -- "$@" --notes-file "$notes"
          else
            echo "No $notes: the manifest carries no release notes."
          fi
          node scripts/sign-update.js "$@"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Tunnelview-update-manifest
          path: assets/tunnelview-update.json
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    # update-manifest too: a release is never published without its signed manifest.
    needs: [windows, macos, update-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The manifest is there, and the four files it lists (installers and zips; the dmgs are not
      # listed) are byte for byte the ones this release attaches. Reads the payload only; the app
      # verifies the signature.
      - name: Signed update manifest matches the assets
        shell: bash
        run: |
          test -s artifacts/tunnelview-update.json || { echo "::error::tunnelview-update.json is missing"; exit 1; }
          jq -r '.payload' artifacts/tunnelview-update.json | base64 -d \
            | jq -r '.files[] | "\(.sha256)  \(.name)"' > manifest.sha256
          test "$(wc -l < manifest.sha256)" -eq 4 || { echo "::error::the manifest does not list 4 files"; exit 1; }
          (cd artifacts && sha256sum --check --strict ../manifest.sha256)

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "Tunnelview $TAG" --generate-notes
          fi

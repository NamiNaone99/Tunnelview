<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incoming connection — Tunnelview</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="./prompt.css">
  <script src="../../shared/protocol.js"></script>
  <script type="module" src="./prompt.js"></script>
</head>
<body>
  <div class="pt" id="app" role="alertdialog" aria-modal="true" aria-labelledby="pt-title" aria-describedby="pt-desc" tabindex="-1">
    <header class="pt-head drag">
      <span class="pt-mark" id="pt-mark"></span>
      <span class="pt-title" id="pt-title">Incoming connection</span>
      <span class="spacer"></span>
      <div class="ring" id="pt-ring" role="timer"></div>
    </header>
    <main class="pt-main" id="pt-main" aria-busy="true">
      <div class="pt-loading"><span class="spinner"></span></div>
    </main>
  </div>
</body>
</html>
